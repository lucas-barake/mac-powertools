name: Release

on:
  push:
    tags:
      - "blackout-v*"
      - "ringlight-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build app
        id: build
        run: |
          APP="${GITHUB_REF_NAME%-v*}"
          VERSION="v${GITHUB_REF_NAME#*-v}"
          NAME="$(tr '[:lower:]' '[:upper:]' <<< "${APP:0:1}")${APP:1}"
          ./"$APP"/build.sh
          ditto -c -k --keepParent "$APP/dist/$NAME.app" "$NAME.zip"
          {
            echo "app=$APP"
            echo "name=$NAME"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NAME="${{ steps.build.outputs.name }}"
          gh release create "$GITHUB_REF_NAME" "$NAME.zip" \
            --title "$NAME ${{ steps.build.outputs.version }}" \
            --notes "Download \`$NAME.zip\`, unzip, move \`$NAME.app\` to /Applications, then clear the quarantine flag (the app is not notarized):

          \`\`\`sh
          xattr -dr com.apple.quarantine /Applications/$NAME.app
          open /Applications/$NAME.app
          \`\`\`

          Requires macOS 13+."
